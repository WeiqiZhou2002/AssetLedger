name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test and build
        run: bash scripts/ci.sh

  # Optional: lets a separate private deployment repository deploy right away.
  # Without both secrets this job does nothing; fork PRs never receive secrets.
  notify-deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Notify deployment repository
        env:
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TARGET: ${{ secrets.DEPLOY_REPOSITORY }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$TARGET" ]; then
            echo "No deployment dispatch configured; skipping."
            exit 0
          fi
          curl -fsS --retry 3 --max-time 30 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET/dispatches" \
            -d '{"event_type":"app-main-updated"}'
